name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /on-mange-quoi/
      # Connexion Google sur iPhone : les pages de connexion Firebase doivent être
      # servies par le même domaine que l'app (sinon Safari/Chrome iOS perdent la
      # connexion en cours). On les copie depuis Firebase dans dist/__/auth/
      # (voir authDomain() dans src/firebase.js et la documentation Firebase,
      # « Best practices for using signInWithRedirect », option 4).
      - name: Pages de connexion Firebase sur le même domaine
        run: |
          set -euo pipefail
          src=https://on-mange-quoi-a0c23.firebaseapp.com/__
          out=dist/__
          mkdir -p "$out/auth" "$out/firebase"
          curl -fsSL "$src/auth/handler" -o "$out/auth/handler.html"
          curl -fsSL "$src/auth/handler.js" -o "$out/auth/handler.js"
          curl -fsSL "$src/auth/experiments.js" -o "$out/auth/experiments.js"
          curl -fsSL "$src/auth/iframe" -o "$out/auth/iframe.html"
          curl -fsSL "$src/auth/iframe.js" -o "$out/auth/iframe.js"
          curl -fsSL "$src/firebase/init.json" -o "$out/firebase/init.json"
          # L'app est dans /on-mange-quoi/ : tous les chemins absolus « /__/ »
          # (scripts, adresse de retour, init.json) sont déplacés sous ce préfixe.
          sed -i -E 's#(["'"'"'])/__/#\1/on-mange-quoi/__/#g' "$out"/auth/*
          echo "--- handler.html"; cat "$out/auth/handler.html"
          echo "--- iframe.html"; cat "$out/auth/iframe.html"
          echo "--- chemins absolus dans les scripts :"
          grep -oE '["'"'"'][^"'"'"']*/__/[^"'"'"']*["'"'"']' "$out"/auth/*.js | sort | uniq -c || true
          if grep -qE '["'"'"']/__/' "$out"/auth/*; then echo "Chemin /__/ non corrigé" >&2; exit 1; fi
          ls -la "$out/auth" "$out/firebase"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
